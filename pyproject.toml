[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "b3_geo"
version = "0.1.0"
description = "Geometry: airfoil, loft, planform, blade"
authors = [{name = "wr1", email = "8971152+wr1@users.noreply.github.com"}]
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy", "scipy", "matplotlib", "pyvista", "CGAL", "shapely", "pydantic", "rich",
    "b3_yml", "cgfoil2"
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-cov", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/b3_geo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --import-mode=importlib"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.mypy]
python_version = "3.10"

[project.scripts]
b3-geo = "b3_geo.cli.main:main"
