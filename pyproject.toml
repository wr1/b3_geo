[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "b3_geo"
version = "1.0.0"
description = "3D realisation of b3_blade Planform and Web objects: sections, fields, web geometry"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "wr1", email = "wrbld3@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "b3_blade",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/b3_geo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/b3_geo --cov-report=term-missing"
markers = [
    "integration: requires b3_geo installed",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "NPY"]
